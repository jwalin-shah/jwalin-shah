<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Jwalin Shah — Reliable agent systems, measured end to end.">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .prompt { fill: #e07a5f; font-weight: 700; }
      .cmd    { fill: #e8e4dc; font-weight: 600; }
      .cursor { fill: #e07a5f; }
      .name   { fill: #f5f1ea; font-weight: 700; letter-spacing: -0.5px; }
      .sub    { fill: #b8aea0; }
      .rule   { stroke: #2a322c; stroke-width: 1; }
      .num    { fill: #e07a5f; font-weight: 700; }
      .lbl    { fill: #8a8278; }
      .pillars { fill: #d4cdc2; }
      .reveal { opacity: 0; animation: fade .55s forwards; }
      .r1 { animation-delay: .05s; } .r2 { animation-delay: .28s; }
      .r3 { animation-delay: .5s; } .r4 { animation-delay: .72s; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes fade  { to { opacity: 1; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .reveal { opacity: 1; animation: none; }
        .blink  { animation: none; }
      }
    </style>
  </defs>
  <rect width="900" height="230" fill="#0e1410" rx="10"/>
  <g transform="translate(40, 36)">
    <text class="mono reveal r1" font-size="15">
      <tspan class="prompt">$</tspan> <tspan class="cmd">whoami</tspan><tspan class="cursor blink">▌</tspan>
    </text>
  </g>
  <text x="40" y="92" class="mono name reveal r2" font-size="30">Jwalin Shah</text>
  <text x="40" y="122" class="mono sub reveal r3" font-size="16">Reliable agent systems, measured end to end.</text>
  <text x="40" y="148" class="mono pillars reveal r3" font-size="13">orchestration · verification · evaluation · memory · local inference</text>
  <line x1="40" y1="168" x2="860" y2="168" class="rule reveal r4"/>
  <g class="reveal r4" transform="translate(40, 198)">
    <text class="mono" font-size="13">
      <tspan class="num">69</tspan><tspan class="lbl"> merged PRs</tspan>
      <tspan class="lbl">  ·  </tspan>
      <tspan class="num">77</tspan><tspan class="lbl"> invariants</tspan>
      <tspan class="lbl">  ·  </tspan>
      <tspan class="num">4,400+</tspan><tspan class="lbl"> evaluations</tspan>
    </text>
    <text x="860" y="0" text-anchor="end" class="mono prompt" font-size="11">github.com/jwalin-shah</text>
  </g>
</svg>
