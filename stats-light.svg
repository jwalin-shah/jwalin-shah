<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="Capability strip: Rust+Go, Swift+CoreML, formal assurance, robotics ops.">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .prompt { fill: #b8462b; font-weight: 700; }
      .head { fill: #6a5847; font-size: 11px; letter-spacing: 0.06em; }
      .num  { fill: #b8462b; font-weight: 700; font-size: 16px; }
      .lbl  { fill: #1a1410; font-size: 13px; }
    </style>
  </defs>
  <rect width="900" height="160" fill="#faf7f2" rx="10"/>
  <text x="40" y="32" class="mono prompt" font-size="13">$ ./stack --strip</text>
  <g transform="translate(40, 58)">
    <text class="mono head">RUST + GO</text>
    <text y="28" class="mono num">production core</text>
    <text y="48" class="mono lbl">memory · orchestration</text>
  </g>
  <g transform="translate(250, 58)">
    <text class="mono head">SWIFT + COREML</text>
    <text y="28" class="mono num">fully local ASR</text>
    <text y="48" class="mono lbl">measured on-device</text>
  </g>
  <g transform="translate(490, 58)">
    <text class="mono head">TLA+ · Z3 · LEAN</text>
    <text y="28" class="mono num">formal assurance</text>
    <text y="48" class="mono lbl">leases · gates · proofs</text>
  </g>
  <g transform="translate(720, 58)">
    <text class="mono head">ROBOTICS OPS</text>
    <text y="28" class="mono num">5 platforms</text>
    <text y="48" class="mono lbl">eval · demos · QA</text>
  </g>
</svg>
