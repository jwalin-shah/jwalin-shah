<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="Proof of work: open source, verification, evaluation, local systems, robotics ops.">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .prompt { fill: #b8462b; font-weight: 700; }
      .head { fill: #6a5847; font-size: 11px; letter-spacing: 0.06em; }
      .num  { fill: #b8462b; font-weight: 700; font-size: 18px; }
      .lbl  { fill: #1a1410; font-size: 13px; }
    </style>
  </defs>
  <rect width="900" height="160" fill="#faf7f2" rx="10"/>
  <text x="40" y="32" class="mono prompt" font-size="13">$ ./proof --strip</text>
  <g transform="translate(40, 58)">
    <text class="mono head">OPEN SOURCE</text>
    <text y="28" class="mono num">69</text>
    <text y="48" class="mono lbl">merged upstream PRs</text>
  </g>
  <g transform="translate(230, 58)">
    <text class="mono head">VERIFICATION</text>
    <text y="28" class="mono num">77</text>
    <text y="48" class="mono lbl">documented invariants</text>
  </g>
  <g transform="translate(440, 58)">
    <text class="mono head">EVALUATION</text>
    <text y="28" class="mono num">4,400+</text>
    <text y="48" class="mono lbl">benchmark runs</text>
  </g>
  <g transform="translate(640, 58)">
    <text class="mono head">LOCAL · ROBOTICS</text>
    <text y="28" class="mono num">on-device</text>
    <text y="48" class="mono lbl">+ 5 robot platforms</text>
  </g>
</svg>
